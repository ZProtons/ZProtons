<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0a0a0a" />
      <stop offset="42%"  stop-color="#3a1012" />
      <stop offset="58%"  stop-color="#7c1016" />
      <stop offset="100%" stop-color="#f1ede4" />
    </linearGradient>

    <radialGradient id="triangleGlow" cx="20%" cy="50%" r="80%">
      <stop offset="0%"  stop-color="#1c5c45" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#114432" stop-opacity="0.97" />
      <stop offset="100%" stop-color="#07140f" stop-opacity="1" />
    </radialGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- base black -> red -> white vertical gradient -->
  <rect x="0" y="0" width="1200" height="220" fill="url(#bgGradient)" />

  
  <g opacity="0.13" fill="#ffffff">
  </g>
  <g opacity="0.11" fill="#ffffff">
    <rect x="496" y="83" width="30" height="30" transform="rotate(0 263 103)" />
    <rect x="420" y="-90" width="30" height="30" transform="rotate(45 263 103)" />
  </g>

  <!-- text -->
  <text x="700" y="108" font-family="Fira Code, Consolas, monospace" font-size="56" font-weight="700"
        fill="#ece7dd" text-anchor="middle" filter="url(#softShadow)">ZProtons</text>
  <text x="700" y="153" font-family="Fira Code, Consolas, monospace" font-size="19"
        fill="#d8d2c4" text-anchor="middle" filter="url(#softShadow)">Web Penetration Tester/Student of Cybersecurity</text>
</svg>
