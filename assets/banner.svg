<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#070707" />
      <stop offset="50%" stop-color="#7a0d14" />
      <stop offset="100%" stop-color="#f1ede4" />
    </linearGradient>

    <radialGradient id="triangleGlow" cx="25%" cy="50%" r="75%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#eaf5ee" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#0e3b2e" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#07140f" stop-opacity="1" />
    </radialGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- base black -> red -> white gradient -->
  <rect x="0" y="0" width="1200" height="220" fill="url(#bgGradient)" />

  <!-- dark green triangle along the bottom, with glowing white gradient inside -->
  <polygon points="0,220 0,70 560,220" fill="url(#triangleGlow)" />
  <polygon points="0,220 0,70 560,220" fill="none" stroke="#06110c" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- text -->
  <text x="600" y="110" font-family="Fira Code, Consolas, monospace" font-size="56" font-weight="700"
        fill="#ece7dd" text-anchor="middle" filter="url(#softShadow)">ZProtons</text>
  <text x="600" y="155" font-family="Fira Code, Consolas, monospace" font-size="19"
        fill="#d8d2c4" text-anchor="middle" filter="url(#softShadow)">Aspiring Web Penetration Tester</text>
</svg>
