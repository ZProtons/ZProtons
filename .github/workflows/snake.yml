name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"  # runs once a day
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ZProtons
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=#39d353,#39d353,#39d353,#39d353&color_dots_0=#0d1117&color_dots_1=#8b0000&color_dots_2=#b30000&color_dots_3=#e00000&color_dots_4=#ff2020&color_empty=#0d1117
            dist/github-contribution-grid-snake-light.svg?color_snake=#000000,#000000,#000000,#000000&color_dots_0=#ebedf0&color_dots_1=#9be9ff&color_dots_2=#4fc3f7&color_dots_3=#1e88e5&color_dots_4=#0d47a1&color_empty=#ebedf0

      - name: Push generated files to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
